<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "InterDisplay"; src: url("vendor/fonts/InterDisplay-Black.otf"); font-weight: 900; }
  @font-face { font-family: "InterDisplay"; src: url("vendor/fonts/InterDisplay-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "Inter"; src: url("vendor/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("vendor/fonts/Inter-Medium.otf"); font-weight: 500; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; }
  /* karartma katmanı / gradyan yok (AGENT.md bölüm 4): yazılar kendi kontur ve gölgeleriyle okunur */
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .ovl { position: absolute; line-height: 1.08; letter-spacing: -0.01em; white-space: normal;
         -webkit-text-stroke: 0.08em rgba(0,0,0,0.7); paint-order: stroke fill;
         text-shadow: 0 0.04em 0.3em rgba(0,0,0,0.8); }
  .ovl .hl { color: #ffd23f; }
  .ovl .cu { color: #ff8a5c; }
  .ovl .bl { color: #6fb2ff; }
  .ovl .rd { color: #ff5a4f; }
  .ovl .gr { color: #5fe08a; }
  .ovl .sm { font-size: 0.62em; font-weight: 600; font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="overlay"></div></div>
<script type="module">
  import { createStage } from './lib/stage.js';
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1080, H = +q.get('h') || 1920;
  const wrap = document.getElementById('wrap');
  wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
  document.documentElement.style.fontSize = (W / 100) + 'px';
  // vw birimleri pencereye göre ölçeklenir; pencere boyutu = video boyutu
  await document.fonts.load('900 40px "InterDisplay"');
  await document.fonts.load('700 40px "InterDisplay"');
  await document.fonts.load('600 40px "Inter"');
  const mod = await import('/' + q.get('scene'));
  const S = createStage({ canvas: document.getElementById('c'), overlay: document.getElementById('overlay'), width: W, height: H, antialias: q.get('aa') !== '0' });
  const frame = await mod.build(S);
  window.__meta = mod.meta;
  window.__S = S;
  window.__render = async (t) => { frame(t); S.render(); await new Promise((r) => requestAnimationFrame(() => r())); return true; };
  // güvenli alan ölçümü (AGENT.md bölüm 4): görünen her yazının içerik kutusu, kare yüzdesi olarak
  window.__boxes = () => [...document.querySelectorAll('#overlay .ovl')].filter((e) => e.style.display !== 'none' && +getComputedStyle(e).opacity > 0.05 && e.firstChild)
    .map((e) => { const r = e.firstChild.getBoundingClientRect(); return { id: e.dataset.id, x0: r.left / W * 100, x1: r.right / W * 100, y0: r.top / H * 100, y1: r.bottom / H * 100, text: e.textContent.slice(0, 40) }; });
  // nesne kutuları (bölüm 4: yazı nesneye binmez; dengeli doluluk): userData.box adı olan görünür nesnelerin ekran izdüşümü;
  // userData.main = true olan görünür grupların birleşik kutusu 'ANA' olarak döner
  window.__objects = () => {
    const out = [], v = new (S.camera.position.constructor)();
    const visible = (o) => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
    const proj = (o) => {
      o.updateWorldMatrix(true, true); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, any = false;
      o.traverse((m) => { if (!m.isMesh || !visible(m) || m.userData.nobox) return; const mt = m.material; if (mt && mt.transparent && mt.opacity < 0.05) return;
        if (!m.geometry.boundingBox) m.geometry.computeBoundingBox(); const b = m.geometry.boundingBox;
        for (let i = 0; i < 8; i++) { v.set(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).applyMatrix4(m.matrixWorld).project(S.camera);
          const X = (v.x + 1) * 50, Y = (1 - v.y) * 50; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); any = true; } });
      return any ? { x0, x1, y0, y1 } : null; };
    S.scene.traverse((o) => { if (!visible(o)) return;
      if (o.userData.box) { const r = proj(o); if (r) out.push({ id: o.userData.box, ...r }); }
      if (o.userData.main) { const r = proj(o); if (r) out.push({ id: 'ANA', ...r }); } });
    return out;
  };
  if (q.get('mask') === '1') (await import('./lib/maske.js')).mask(wrap);
  window.__ready = true;
</script>
</body>
</html>
