<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="icon" href="data:,">
<style>html,body{margin:0;padding:0;background:#fbfaf6;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  import { init, draw, boxes, busyAt, shapes, pathsAt, vurgular, yazilar, cizgiler } from './motor.js';
  const id = new URLSearchParams(location.search).get('id') || '1';
  try { const { build } = await import(`./sahne-${id}.js`);
    window.__meta = await init(document.getElementById('c'), id, build);
    window.__draw = (t) => { draw(t); return true; }; window.__boxes = boxes; window.__busy = busyAt; window.__shapes = shapes; window.__pathsAt = pathsAt;
    window.__vurgular = vurgular; window.__yazilar = yazilar; window.__cizgiler = cizgiler; window.__ready = true; }
  catch (e) { window.__err = String(e && e.stack || e); }
</script></body></html>
