<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="icon" href="data:,">
<style>html,body{margin:0;padding:0;background:#fff;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  import { init, draw, boxes, busy } from './sahne.js';
  const mode = new URLSearchParams(location.search).get('mode') || 'uzun';
  try { window.__meta = await init(mode, document.getElementById('c')); window.__draw = (t) => { draw(t); return true; }; window.__boxes = boxes; window.__busy = busy; window.__ready = true; }
  catch (e) { window.__err = String(e && e.stack || e); }
</script></body></html>
